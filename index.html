<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Career Navigator — AI roadmaps back to work</title>
  <style>
    /* ============ Tokens ============ */
    :root {
      --bg: #ffffff;
      --bg-soft: #f5f4ef;
      --ink: #232936;
      --muted: #5c6570;
      --line: #e4e2d9;
      --accent: #0e7c66;
      --accent-soft: #e3f0ec;
      --accent-ink: #ffffff;
      --node: #ffe985;
      --node-alt: #fff6cf;
      --node-border: #2f2f2f;
      --node-ink: #262620;
      --wire: #2b78e4;
      --card: #ffffff;
      --tip-bg: #ecf5f1;
      --done: #1d9e6f;
      --shadow: 0 1px 2px rgba(35, 41, 54, .06), 0 8px 24px rgba(35, 41, 54, .07);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14171c;
        --bg-soft: #1a1e25;
        --ink: #e8eaed;
        --muted: #9aa3ad;
        --line: #2b303a;
        --accent: #2fbf9a;
        --accent-soft: #173029;
        --accent-ink: #0d1512;
        --node: #f2d95c;
        --node-alt: #4a4325;
        --node-border: #0c0c0c;
        --wire: #5b93e8;
        --card: #1a1e25;
        --tip-bg: #16302a;
        --done: #3fd598;
        --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35);
      }
    }

    :root[data-theme="dark"] {
      --bg: #14171c;
      --bg-soft: #1a1e25;
      --ink: #e8eaed;
      --muted: #9aa3ad;
      --line: #2b303a;
      --accent: #2fbf9a;
      --accent-soft: #173029;
      --accent-ink: #0d1512;
      --node: #f2d95c;
      --node-alt: #4a4325;
      --node-border: #0c0c0c;
      --wire: #5b93e8;
      --card: #1a1e25;
      --tip-bg: #16302a;
      --done: #3fd598;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35);
    }

    :root[data-theme="light"] {
      --bg: #ffffff;
      --bg-soft: #f5f4ef;
      --ink: #232936;
      --muted: #5c6570;
      --line: #e4e2d9;
      --accent: #0e7c66;
      --accent-soft: #e3f0ec;
      --accent-ink: #ffffff;
      --node: #ffe985;
      --node-alt: #fff6cf;
      --node-border: #2f2f2f;
      --node-ink: #262620;
      --wire: #2b78e4;
      --card: #ffffff;
      --tip-bg: #ecf5f1;
      --done: #1d9e6f;
      --shadow: 0 1px 2px rgba(35, 41, 54, .06), 0 8px 24px rgba(35, 41, 54, .07);
    }

    :root[data-theme="dark"] {
      --node-ink: #262620;
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      margin: 0;
      padding: 0
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font: 16px/1.6 "Avenir Next", "Segoe UI", "Helvetica Neue", ui-sans-serif, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .mono {
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace
    }

    a {
      color: var(--accent)
    }

    button {
      font: inherit;
      cursor: pointer
    }

    h1,
    h2,
    h3 {
      line-height: 1.15;
      text-wrap: balance;
      margin: 0 0 .5rem
    }

    h1 {
      font-size: clamp(2rem, 5vw, 3.1rem);
      font-weight: 800;
      letter-spacing: -.02em
    }

    h2 {
      font-size: clamp(1.4rem, 3vw, 1.9rem);
      font-weight: 800;
      letter-spacing: -.015em
    }

    h3 {
      font-size: 1.08rem;
      font-weight: 700
    }

    p {
      margin: .35rem 0 1rem
    }

    .muted {
      color: var(--muted)
    }

    .wrap {
      max-width: 1060px;
      margin: 0 auto;
      padding: 0 20px
    }

    .eyebrow {
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: .72rem;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--accent);
      margin: 0 0 .6rem;
    }

    :focus-visible {
      outline: 2px solid var(--wire);
      outline-offset: 2px;
      border-radius: 4px
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important
      }
    }

    /* ============ Nav ============ */
    header.site {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--bg);
      border-bottom: 1px solid var(--line);
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 60px
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      text-decoration: none;
      color: var(--ink);
      margin-right: auto
    }

    .logo-mark {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: var(--accent);
      color: var(--accent-ink);
      display: grid;
      place-items: center;
      font-family: ui-monospace, Menlo, monospace;
      font-size: 15px;
      font-weight: 700;
    }

    .nav a.navlink {
      text-decoration: none;
      color: var(--muted);
      font-size: .92rem;
      font-weight: 600;
      padding: 7px 11px;
      border-radius: 8px;
    }

    .nav a.navlink:hover {
      color: var(--ink);
      background: var(--bg-soft)
    }

    .nav a.navlink.active {
      color: var(--accent);
      background: var(--accent-soft)
    }

    .theme-btn {
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--ink);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: .85rem;
      margin-left: 6px;
    }

    .demo-pill {
      font-family: ui-monospace, Menlo, monospace;
      font-size: .66rem;
      letter-spacing: .1em;
      border: 1px dashed var(--muted);
      color: var(--muted);
      border-radius: 99px;
      padding: 3px 9px;
    }

    @media (max-width:760px) {
      .nav {
        flex-wrap: wrap;
        height: auto;
        padding: 8px 0
      }

      .demo-pill {
        display: none
      }
    }

    /* ============ Hero ============ */
    .hero {
      padding: 64px 0 40px;
      border-bottom: 1px solid var(--line);
      background:
        radial-gradient(900px 400px at 85% -10%, var(--accent-soft), transparent 65%);
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.05fr .95fr;
      gap: 44px;
      align-items: center
    }

    @media (max-width:860px) {
      .hero-grid {
        grid-template-columns: 1fr
      }
    }

    .hero p.lede {
      font-size: 1.12rem;
      color: var(--muted);
      max-width: 34rem
    }

    .cta-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 20px
    }

    .btn {
      display: inline-block;
      text-decoration: none;
      font-weight: 700;
      border-radius: 10px;
      padding: 12px 20px;
      border: 1px solid transparent;
      font-size: .98rem;
    }

    .btn-primary {
      background: var(--accent);
      color: var(--accent-ink)
    }

    .btn-primary:hover {
      filter: brightness(1.08)
    }

    .btn-ghost {
      border-color: var(--line);
      color: var(--ink);
      background: var(--card)
    }

    .btn-ghost:hover {
      background: var(--bg-soft)
    }

    .hero-stats {
      display: flex;
      gap: 26px;
      margin-top: 26px;
      flex-wrap: wrap
    }

    .hero-stats div b {
      display: block;
      font-size: 1.25rem;
      font-variant-numeric: tabular-nums
    }

    .hero-stats div span {
      font-size: .8rem;
      color: var(--muted)
    }

    /* mini map in hero */
    .mini-map {
      position: relative;
      height: 330px;
      min-width: 300px
    }

    .mini-node {
      position: absolute;
      background: var(--node);
      color: var(--node-ink);
      border: 2px solid var(--node-border);
      border-radius: 9px;
      padding: 8px 12px;
      font-size: .82rem;
      font-weight: 700;
      line-height: 1.25;
      box-shadow: 2px 3px 0 var(--node-border);
      text-decoration: none;
      transition: transform .12s ease;
    }

    .mini-node:hover {
      transform: translate(-1px, -1px)
    }

    .mini-node.alt {
      background: var(--node-alt);
      color: var(--ink);
      box-shadow: 1px 2px 0 var(--node-border)
    }

    .mini-map svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none
    }

    .mini-map svg path {
      stroke: var(--wire);
      stroke-width: 2;
      fill: none;
      stroke-dasharray: 5 5;
      opacity: .8
    }

    /* ============ Sections ============ */
    section.block {
      padding: 56px 0;
      border-bottom: 1px solid var(--line)
    }

    .grid-4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px
    }

    @media (max-width:900px) {
      .grid-4 {
        grid-template-columns: repeat(2, 1fr)
      }

      .grid-3 {
        grid-template-columns: 1fr
      }
    }

    @media (max-width:600px) {
      .grid-4 {
        grid-template-columns: 1fr
      }

      .grid-2 {
        grid-template-columns: 1fr
      }
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 20px;
      box-shadow: var(--shadow);
    }

    a.card {
      display: block;
      text-decoration: none;
      color: var(--ink)
    }

    a.card:hover {
      border-color: var(--accent)
    }

    .card .tag {
      font-family: ui-monospace, Menlo, monospace;
      font-size: .66rem;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--accent);
    }

    .card h3 {
      margin: .4rem 0 .35rem
    }

    .card p {
      font-size: .9rem;
      color: var(--muted);
      margin: 0
    }

    .card .meta {
      margin-top: 12px;
      font-size: .78rem;
      color: var(--muted);
      font-family: ui-monospace, Menlo, monospace
    }

    .step-num {
      font-family: ui-monospace, Menlo, monospace;
      font-weight: 700;
      color: var(--accent);
      font-size: .8rem;
      letter-spacing: .08em;
    }

    .b2b-strip {
      background: var(--bg-soft)
    }

    /* ============ Roadmap view ============ */
    .rm-head {
      display: flex;
      align-items: flex-end;
      gap: 20px;
      flex-wrap: wrap;
      padding: 34px 0 18px
    }

    .rm-head .grow {
      flex: 1;
      min-width: 260px
    }

    .progress-box {
      min-width: 230px
    }

    .progress-label {
      display: flex;
      justify-content: space-between;
      font-size: .78rem;
      color: var(--muted);
      font-family: ui-monospace, Menlo, monospace;
      margin-bottom: 6px
    }

    .progress-bar {
      height: 8px;
      border-radius: 99px;
      background: var(--bg-soft);
      border: 1px solid var(--line);
      overflow: hidden
    }

    .progress-fill {
      height: 100%;
      background: var(--done);
      width: 0%;
      transition: width .25s ease
    }

    .rm-reset {
      border: none;
      background: none;
      color: var(--muted);
      font-size: .75rem;
      text-decoration: underline;
      padding: 4px 0
    }

    .rm-scroll {
      overflow-x: auto;
      padding-bottom: 60px
    }

    .rm-canvas {
      position: relative;
      margin: 0 auto
    }

    .rm-canvas svg {
      position: absolute;
      inset: 0;
      pointer-events: none
    }

    .rm-canvas svg path.wire {
      stroke: var(--wire);
      stroke-width: 2;
      fill: none;
      stroke-dasharray: 5 5;
      opacity: .85
    }

    .rm-canvas svg path.spine {
      stroke: var(--wire);
      stroke-width: 3;
      fill: none;
      opacity: .9
    }

    .rm-node {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: var(--node);
      color: var(--node-ink);
      border: 2px solid var(--node-border);
      border-radius: 10px;
      padding: 6px 12px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 2px 3px 0 var(--node-border);
      font-size: .86rem;
      line-height: 1.25;
      transition: transform .1s ease;
    }

    .rm-node:hover {
      transform: translate(-1px, -1px)
    }

    .rm-node.main {
      font-size: 1rem;
      border-width: 2.5px;
      box-shadow: 3px 4px 0 var(--node-border)
    }

    .rm-node.child {
      background: var(--node-alt);
      color: var(--ink);
      font-weight: 600;
      box-shadow: 1.5px 2.5px 0 var(--node-border)
    }

    .rm-node.done {
      opacity: .66
    }

    .rm-node.done::after {
      content: "✓";
      position: absolute;
      top: -9px;
      right: -9px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--done);
      color: #fff;
      font-size: 12px;
      font-weight: 800;
      display: grid;
      place-items: center;
      border: 2px solid var(--bg);
    }

    .rm-legend {
      display: flex;
      gap: 18px;
      font-size: .75rem;
      color: var(--muted);
      padding: 6px 0 14px;
      font-family: ui-monospace, Menlo, monospace;
      flex-wrap: wrap
    }

    .rm-legend i {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 1.5px solid var(--node-border);
      border-radius: 3px;
      vertical-align: -1px;
      margin-right: 6px
    }

    .rm-legend .l-main i {
      background: var(--node)
    }

    .rm-legend .l-child i {
      background: var(--node-alt)
    }

    .rm-legend .l-done i {
      background: var(--done);
      border-color: var(--done)
    }

    /* ============ Drawer ============ */
    .drawer-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 18, 24, .45);
      z-index: 90;
      opacity: 0;
      pointer-events: none;
      transition: opacity .18s ease;
    }

    .drawer-backdrop.open {
      opacity: 1;
      pointer-events: auto
    }

    .drawer {
      position: fixed;
      top: 0;
      right: 0;
      height: 100%;
      width: min(420px, 94vw);
      z-index: 100;
      background: var(--card);
      border-left: 1px solid var(--line);
      transform: translateX(102%);
      transition: transform .22s ease;
      display: flex;
      flex-direction: column;
    }

    .drawer.open {
      transform: translateX(0)
    }

    .drawer-head {
      padding: 20px 22px 14px;
      border-bottom: 1px solid var(--line)
    }

    .drawer-head .tag {
      font-family: ui-monospace, Menlo, monospace;
      font-size: .68rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--accent)
    }

    .drawer-head h3 {
      font-size: 1.25rem;
      margin: .3rem 0 0
    }

    .drawer-close {
      position: absolute;
      top: 14px;
      right: 14px;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--muted);
      border-radius: 8px;
      width: 32px;
      height: 32px;
      font-size: 16px;
      line-height: 1;
    }

    .drawer-body {
      padding: 18px 22px;
      overflow-y: auto;
      flex: 1
    }

    .drawer-body p {
      font-size: .94rem
    }

    .drawer-body h4 {
      margin: 18px 0 8px;
      font-size: .78rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      font-family: ui-monospace, Menlo, monospace;
      color: var(--muted)
    }

    .drawer-body ul {
      margin: 0;
      padding-left: 18px;
      font-size: .9rem
    }

    .drawer-body ul li {
      margin-bottom: 6px
    }

    .ai-tip {
      background: var(--tip-bg);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: .88rem;
      margin-top: 16px;
      border: 1px solid var(--line);
    }

    .ai-tip b {
      color: var(--accent)
    }

    .drawer-foot {
      padding: 16px 22px;
      border-top: 1px solid var(--line)
    }

    .done-btn {
      width: 100%;
      border-radius: 10px;
      padding: 12px;
      font-weight: 700;
      font-size: .95rem;
      border: 2px solid var(--done);
      background: var(--done);
      color: #fff;
    }

    .done-btn.undone {
      background: transparent;
      color: var(--done)
    }

    /* ============ Assessment ============ */
    .quiz-shell {
      max-width: 640px;
      margin: 0 auto;
      padding: 44px 0 70px
    }

    .quiz-progress {
      display: flex;
      gap: 6px;
      margin-bottom: 26px
    }

    .quiz-progress span {
      flex: 1;
      height: 5px;
      border-radius: 99px;
      background: var(--bg-soft);
      border: 1px solid var(--line)
    }

    .quiz-progress span.on {
      background: var(--accent);
      border-color: var(--accent)
    }

    .quiz-q {
      font-size: 1.35rem;
      font-weight: 800;
      margin-bottom: 6px;
      letter-spacing: -.01em
    }

    .quiz-sub {
      color: var(--muted);
      font-size: .9rem;
      margin-bottom: 20px
    }

    .opt {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      text-align: left;
      background: var(--card);
      border: 1.5px solid var(--line);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 10px;
      font-size: .97rem;
      color: var(--ink);
    }

    .opt:hover {
      border-color: var(--accent)
    }

    .opt.selected {
      border-color: var(--accent);
      background: var(--accent-soft)
    }

    .opt .k {
      font-family: ui-monospace, Menlo, monospace;
      font-size: .7rem;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 2px 7px;
      color: var(--muted);
      flex-shrink: 0;
    }

    .quiz-nav {
      display: flex;
      justify-content: space-between;
      margin-top: 22px
    }

    .result-match {
      font-family: ui-monospace, Menlo, monospace;
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      color: var(--accent);
      font-size: 1.05rem;
    }

    .match-bar {
      height: 6px;
      border-radius: 99px;
      background: var(--bg-soft);
      border: 1px solid var(--line);
      overflow: hidden;
      margin: 8px 0 12px
    }

    .match-fill {
      height: 100%;
      background: var(--accent)
    }

    .badge {
      display: inline-block;
      font-size: .68rem;
      font-family: ui-monospace, Menlo, monospace;
      letter-spacing: .08em;
      text-transform: uppercase;
      border-radius: 99px;
      padding: 3px 10px;
      background: var(--accent-soft);
      color: var(--accent);
      margin-right: 6px;
    }

    .facts {
      display: flex;
      gap: 18px;
      font-size: .82rem;
      color: var(--muted);
      flex-wrap: wrap;
      font-family: ui-monospace, Menlo, monospace
    }

    /* ============ Strategy timeline ============ */
    .timeline {
      position: relative;
      margin: 30px 0 0;
      padding-left: 34px
    }

    .timeline::before {
      content: "";
      position: absolute;
      left: 11px;
      top: 6px;
      bottom: 6px;
      width: 3px;
      background: var(--wire);
      opacity: .55;
      border-radius: 2px
    }

    .t-item {
      position: relative;
      padding-bottom: 34px
    }

    .t-item::before {
      content: "";
      position: absolute;
      left: -31px;
      top: 4px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--node);
      border: 2.5px solid var(--node-border);
    }

    .t-item .phase {
      font-family: ui-monospace, Menlo, monospace;
      font-size: .7rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--accent)
    }

    .t-item h3 {
      margin: .25rem 0 .4rem
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px
    }

    .chip {
      font-size: .78rem;
      border: 1px solid var(--line);
      border-radius: 99px;
      padding: 4px 12px;
      background: var(--card);
      color: var(--muted)
    }

    footer.site {
      padding: 36px 0 48px;
      color: var(--muted);
      font-size: .85rem
    }

    footer.site .wrap {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--ink);
      color: var(--bg);
      padding: 11px 20px;
      border-radius: 10px;
      font-size: .9rem;
      font-weight: 600;
      z-index: 200;
      transition: transform .25s ease, opacity .25s ease;
      opacity: 0;
      pointer-events: none;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1
    }

    /* form */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px
    }

    @media (max-width:600px) {
      .form-grid {
        grid-template-columns: 1fr
      }
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 5px
    }

    .field label {
      font-size: .78rem;
      font-weight: 700;
      color: var(--muted)
    }

    .field input,
    .field select,
    .field textarea {
      background: var(--bg);
      border: 1.5px solid var(--line);
      border-radius: 9px;
      padding: 10px 12px;
      font: inherit;
      color: var(--ink);
    }

    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      border-color: var(--accent);
      outline: none
    }
  </style>
</head>

    /* ---------- Roadmap renderer (roadmap.sh style) ---------- */
    const L = {
      W: 980, centerX: 490, mainW: 260, mainH: 58, childW: 210, childH: 52,
      childGapY: 16, phaseGap: 64, sideGap: 70
    };

    function layoutRoadmap(rmId) {
      const rm = ROADMAPS[rmId];
      const nodes = [], wires = [], spine = [];
      let y = 30, prevBottom = 0;
      rm.phases.forEach((p, pi) => {
        const leftN = (p.left || []), rightN = (p.right || []);
        const lh = leftN.length * L.childH + (leftN.length - 1) * L.childGapY;
        const rh = rightN.length * L.childH + (rightN.length - 1) * L.childGapY;
        const blockH = Math.max(L.mainH, lh, rh);
        const mainY = y + (blockH - L.mainH) / 2;
        const mainX = L.centerX - L.mainW / 2;
        nodes.push({
          id: rmId + "/" + pi + "/main", x: mainX, y: mainY, w: L.mainW, h: L.mainH,
          cls: "main", t: p.main.t, node: p.main, phase: p.main.t
        });
        if (pi > 0) spine.push({ x: L.centerX, y1: prevBottom, y2: mainY });
        /* children */
        let ly = y + (blockH - lh) / 2;
        leftN.forEach((n, i) => {
          const cx = L.centerX - L.mainW / 2 - L.sideGap - L.childW;
          nodes.push({
            id: rmId + "/" + pi + "/l" + i, x: cx, y: ly, w: L.childW, h: L.childH,
            cls: "child", t: n.t, node: n, phase: p.main.t
          });
          wires.push({ x1: mainX, y1: mainY + L.mainH / 2, x2: cx + L.childW, y2: ly + L.childH / 2 });
          ly += L.childH + L.childGapY;
        });
        let ry = y + (blockH - rh) / 2;
        rightN.forEach((n, i) => {
          const cx = L.centerX + L.mainW / 2 + L.sideGap;
          nodes.push({
            id: rmId + "/" + pi + "/r" + i, x: cx, y: ry, w: L.childW, h: L.childH,
            cls: "child", t: n.t, node: n, phase: p.main.t
          });
          wires.push({ x1: mainX + L.mainW, y1: mainY + L.mainH / 2, x2: cx, y2: ry + L.childH / 2 });
          ry += L.childH + L.childGapY;
        });
        prevBottom = mainY + L.mainH;
        y += blockH + L.phaseGap;
      });
      return { nodes, wires, spine, height: y - L.phaseGap + 40 };
    }
